name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run domain tests and build the game
        run: dotnet run --project Tests/RedMeridian.Tests.csproj --configuration Release
      - name: Smoke-test the headless stress runner
        run: dotnet run --project Tools/Stress/RedMeridian.Stress.csproj --configuration Release -- --batches 2 --speed 4
      - name: Check browser scripts
        run: |
          for script in Source/wwwroot/*.js; do
            node --check "$script" || exit 1
          done
      - name: Run asset and live API tests
        run: node --test Tests/game.test.mjs
